<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StayEase - Hotels</title>

    <link rel="stylesheet" href="css/common.css">

    <link rel="stylesheet" href="css/hotels.css">

</head>


<body>


    <!-- ==========================================
         NAVIGATION BAR
    =========================================== -->

    <nav>

        <div class="logo">
            🏨 StayEase
        </div>


        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="hotels.html">
                    Hotels
                </a>
            </li>

            <li>
                <a href="room-details.html">
                    Rooms
                </a>
            </li>

            <li>
                <a href="login.html">
                    Login
                </a>
            </li>

            <li>
                <a href="register.html">
                    Register
                </a>
            </li>

            <li>
                <a href="payment.html">
                    Profile
                </a>
            </li>

            <li>
                <a href="profile.html">
                    Payment
                </a>
            </li>

        </ul>

    </nav>



    <!-- ==========================================
         HOTEL SEARCH SECTION
    =========================================== -->

    <div class="search-container">

        <div class="search-box">


            <!-- DESTINATION -->

            <input
                type="text"
                id="destination"
                placeholder="Enter City or Destination"
                autocomplete="off"
            >


            <!-- CHECK-IN -->

            <input
                type="date"
                id="check-in"
            >


            <!-- CHECK-OUT -->

            <input
                type="date"
                id="check-out"
            >


            <!-- NUMBER OF GUESTS -->

            <select id="adults">

                <option value="1">
                    1 Guest
                </option>

                <option value="2" selected>
                    2 Guests
                </option>

                <option value="3">
                    3 Guests
                </option>

                <option value="4">
                    4 Guests
                </option>

                <option value="5">
                    5 Guests
                </option>

                <option value="6">
                    6 Guests
                </option>

            </select>


            <!-- SEARCH BUTTON -->

            <button
                class="search-btn"
                onclick="searchHotel()"
            >
                Search
            </button>


        </div>

    </div>



    <!-- ==========================================
         HOTEL / RECENT SEARCH RESULTS
    =========================================== -->

    <section
        class="featured"
        id="featured-hotels"
    >

        <!--
            JavaScript will automatically put:

            1. Recent Searches
               OR
            2. Supabase Hotels
               OR
            3. SerpAPI Search Results

            inside this container.
        -->

    </section>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="js/common.js"></script>


    <!-- Supabase Library -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase Configuration -->

    <script src="js/supabase.js"></script>


    <!-- Hotel Search Logic -->

    <script src="js/hotels.js"></script>


</body>

</html>
